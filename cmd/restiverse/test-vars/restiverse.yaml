timeout: 30s
editor: $EDITOR
max_responses: 5

vars:
  environ:
    - stage
    - prod
  node:
    - a
    - b
    - c

actions:
  - name: Execute Request
    command: internal:execute
    keybinding: r
    min_files: 1
    max_files: 1
    file_types:
      - http
  - name: Edit File
    command: $EDITOR {filename}
    keybinding: e
    min_files: 1
    max_files: 1
    file_types:
      - http
      - body
      - meta
  - name: View Output History
    command: internal:history
    keybinding: h
    min_files: 1
    max_files: 1
    file_types:
      - http
