timeout: 30s
editor: $EDITOR
actions:
    - name: Execute Request
      command: internal:execute
      keybinding: r
      min_files: 1
      max_files: 1
      file_types:
        - http
    - name: Edit File
      command: $EDITOR {filename}
      keybinding: e
      min_files: 1
      max_files: 1
      file_types:
        - http
        - body
        - meta
    - name: View Output History
      command: internal:history
      keybinding: h
      min_files: 1
      max_files: 1
      file_types:
        - http
    - name: View Body
      command: less {filename}
      min_files: 1
      max_files: 1
      file_types:
        - body
    - name: View as JSON
      command: fx {filename}
      min_files: 1
      max_files: 1
      file_types:
        - body
    - name: View Meta
      command: less {filename}
      min_files: 1
      max_files: 1
      file_types:
        - meta
    - name: Delete Response
      command: rm {filename}
      min_files: 1
      max_files: null
      file_types:
        - body
        - meta
